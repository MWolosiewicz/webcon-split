services:
  splitter:
    build: .
    image: webcon-pdf-splitter:latest
    container_name: webcon-pdf-splitter
    restart: unless-stopped
    ports:
      # port hosta 8010 (8000 zajmuje kontener pdf-processor); w kontenerze serwis slucha na 8000
      - "8010:8000"
    # Cala konfiguracja (zmienne SPLITTER_*) zyje w pliku .env obok tego
    # compose - szablon z opisami: .env.example, szczegoly: README.md.
    env_file:
      - .env
    # Wolumen na szablony promptow LLM z hosta (opcjonalny) - po odkomentowaniu
    # wskaz pliki w .env (SPLITTER_LLM_PROMPT_FILE / ..._SYSTEM_PROMPT_FILE).
    # volumes:
    #   - ./prompts:/app/prompts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
