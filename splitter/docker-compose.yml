services:
  splitter:
    build: .
    image: webcon-pdf-splitter:latest
    container_name: webcon-pdf-splitter
    restart: unless-stopped
    ports:
      # port hosta 8010 (8000 zajmuje kontener pdf-processor); w kontenerze serwis slucha na 8000
      - "8010:8000"
    # Zmienne (m.in. SPLITTER_API_TOKEN, SPLITTER_LOG_LEVEL) czytane sa
    # z pliku .env obok tego compose - patrz docs/deployment/splitter-service.md
    env_file:
      - .env
    # Szablony promptow LLM z hosta (opcjonalne) - patrz docs/llm-prompt.md.
    # Po odkomentowaniu ustaw w .env:
    #   SPLITTER_LLM_PROMPT_FILE=/app/prompts/user-prompt.txt
    #   SPLITTER_LLM_SYSTEM_PROMPT_FILE=/app/prompts/system-prompt.txt
    # volumes:
    #   - ./prompts:/app/prompts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
