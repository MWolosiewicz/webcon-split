services:
  splitter:
    build: .
    image: webcon-pdf-splitter:latest
    container_name: webcon-pdf-splitter
    restart: unless-stopped
    ports:
      # port hosta 8010 (8000 zajmuje kontener pdf-processor); w kontenerze serwis slucha na 8000
      - "8010:8000"
    # Zmienne (m.in. SPLITTER_DATABASE_CONNECTION_STRING, SPLITTER_API_TOKEN)
    # czytane sa z pliku .env obok tego compose - patrz docs/deployment/splitter-service.md
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
